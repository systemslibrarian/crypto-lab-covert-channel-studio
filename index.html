<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self';
                 img-src 'self' data:;
                 font-src 'self';
                 connect-src 'none';
                 object-src 'none';
                 base-uri 'none';
                 form-action 'none';
                 frame-ancestors 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark" />
  <meta name="description"
        content="Covert Channel Studio — an educational Crypto-Lab exhibit on covert channels: hidden communication in protocols, timing, and media. Fully simulated in the browser; no real network traffic." />
  <title>Covert Channel Studio — Crypto-Lab</title>
  <link rel="icon" href="assets/sample-cover-image.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">CC</div>
      <div class="brand-text">
        <h1>Covert Channel Studio</h1>
        <p>Crypto-Lab · hidden communication in protocols, timing &amp; media</p>
      </div>
    </div>
    <div class="header-controls" id="header-controls"></div>
  </header>

  <div class="app-body">
    <nav class="sidebar" id="nav" aria-label="Exhibit sections"></nav>
    <main class="app-main" id="main" tabindex="-1"></main>
  </div>

  <footer class="app-footer" id="footer"></footer>

  <noscript>
    <div class="noscript-note">
      <h2>JavaScript is required</h2>
      <p>Covert Channel Studio is an interactive simulation that runs entirely in your
      browser with no backend. Please enable JavaScript to explore the exhibit. All
      activity is local — nothing is sent over the network.</p>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
