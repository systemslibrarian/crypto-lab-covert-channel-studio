<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Not found — Covert Channel Studio</title>
  <!-- Self-contained so it renders correctly no matter what path was requested
       on a GitHub Pages project site. No scripts fetch anything off-origin. -->
  <style>
    :root {
      --bg: #0a0e14; --surface: #131a24; --border: #263243;
      --text: #e7eef6; --dim: #a8b8c8; --faint: #728398; --accent: #2dd4bf;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      display: grid; place-items: center; padding: 2rem;
      background-image:
        radial-gradient(900px 500px at 80% -10%, rgba(45,212,191,.10), transparent 60%),
        radial-gradient(700px 420px at 5% 5%, rgba(96,165,250,.08), transparent 55%);
    }
    .card {
      max-width: 40rem; text-align: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem 2rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    .code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 3rem; font-weight: 800; letter-spacing: .04em;
      background: linear-gradient(140deg, var(--accent), #60a5fa);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: .5rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { color: var(--dim); line-height: 1.6; margin: 0 auto 1.5rem; max-width: 32rem; }
    .hint { color: var(--faint); font-size: .85rem; }
    a.home {
      display: inline-block; text-decoration: none; font-weight: 650;
      color: #0a0e14; background: var(--accent);
      padding: .6rem 1.2rem; border-radius: 9px;
    }
    a.home:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code" aria-hidden="true">404</div>
    <h1>This page isn't in the exhibit</h1>
    <p>
      Covert Channel Studio navigates with in-page <code>#</code> links, so the address
      you followed may be out of date. Everything runs locally — nothing was sent anywhere.
    </p>
    <p><a class="home" id="home" href="./">Return to the exhibit</a></p>
    <p class="hint">If the link above doesn't work, open the site's <code>index.html</code>.</p>
  </main>
  <script>
    // On a GitHub Pages project site the repo name is the first path segment;
    // point "home" at that root so the link works from any missing path.
    (function () {
      try {
        var seg = location.pathname.split('/').filter(Boolean);
        var base = seg.length ? '/' + seg[0] + '/' : '/';
        document.getElementById('home').setAttribute('href', base);
      } catch (e) { /* keep the ./ fallback */ }
    })();
  </script>
</body>
</html>
